name: fsx native tests
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ntfs_live:
        description: Run privileged real-NTFS Release acceptance and comparisons
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: fsx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, rid: linux-x64, preset: linux-debug, triplet: x64-linux, content: 'ON', search_tools: 'ON', ugrep: 'build/linux-debug/vcpkg_installed/x64-linux/tools/ugrep/ugrep'}
          - {runner: ubuntu-24.04, rid: linux-x64, preset: linux-asan-ubsan, triplet: x64-linux, content: 'ON', search_tools: 'ON', ugrep: 'build/linux-asan-ubsan/vcpkg_installed/x64-linux/tools/ugrep/ugrep'}
          - {runner: windows-2025, rid: windows-x64, preset: windows-debug, triplet: qigao-x64-windows-llvm-mingw, content: 'ON', search_tools: 'OFF', ugrep: 'build/windows-tool-candidate/build-search-tools/installed/qigao-x64-windows-llvm-mingw-static/tools/ugrep/ugrep.exe'}
          - {runner: macos-15, rid: macos-arm64, preset: macos-debug, triplet: arm64-osx, content: 'ON', search_tools: 'ON', ugrep: 'build/macos-debug/vcpkg_installed/arm64-osx/tools/ugrep/ugrep'}
          - {runner: macos-15-intel, rid: macos-x64, preset: macos-x64-debug, triplet: x64-osx, content: 'ON', search_tools: 'ON', ugrep: 'build/macos-x64-debug/vcpkg_installed/x64-osx/tools/ugrep/ugrep'}
          - {runner: macos-15-intel, rid: macos-x64, preset: macos-x64-asan-ubsan, triplet: x64-osx, content: 'ON', search_tools: 'ON', ugrep: 'build/macos-x64-asan-ubsan/vcpkg_installed/x64-osx/tools/ugrep/ugrep'}
    env: &native_environment
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-binary-cache
      VCPKG_DOWNLOADS: ${{ github.workspace }}/build/vcpkg-downloads
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 256MiB
      CCACHE_COMPILERCHECK: content
    steps: &native_steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
            ${{ env.CCACHE_DIR }}
          key: fsx-${{ runner.os }}-${{ matrix.preset }}-v0.1.002-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'CMakeUserPresets.json', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            fsx-${{ runner.os }}-${{ matrix.preset }}-v0.1.002-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'CMakeUserPresets.json', '.github/workflows/ci.yml') }}-
      - name: Prepare cache directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE, $env:VCPKG_DOWNLOADS, $env:CCACHE_DIR | Out-Null
      - uses: qigao/vcpkg-cache/.github/actions/setup-llvm-native@v0.1.002
        if: runner.os == 'Linux'
        with:
          build-type: toolchain-only
          obfuscator: "false"
      - uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@v0.1.002
        if: runner.os == 'Windows'
        with:
          target: x64
          build-type: toolchain-only
          obfuscator: "false"
      - name: Select LLVM for manifest ABI resolution and builds
        shell: pwsh
        run: |
          $compiler = if ($IsWindows) { $env:LLVM_MINGW_CC } elseif ($IsMacOS) { 'clang' } else { $env:LLVM_NATIVE_CC }
          $cppCompiler = if ($IsWindows) { $env:LLVM_MINGW_CXX } elseif ($IsMacOS) { 'clang++' } else { $env:LLVM_NATIVE_CXX }
          if (-not $compiler -or -not $cppCompiler) { throw 'LLVM setup did not select both compilers' }
          "CC=$compiler" >> $env:GITHUB_ENV
          "CXX=$cppCompiler" >> $env:GITHUB_ENV
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@v0.1.002
        id: dependencies
        with:
          restore-packages: "false"
          triplet: ${{ matrix.triplet }}
          host-triplet: ${{ matrix.triplet }}
          token: ${{ github.token }}
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@v0.1.002
        with:
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact first-party SDKs and ccache using curl
        id: sdks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $curl = if ($IsWindows) { 'curl.exe' } else { 'curl' }
          $sdkPackages = @(
            @('salts-core', 'v0.1.002', 'SaltsCore.Native.0.1.2.nupkg', '8f3407de65ed73d5aca4bd7bc1274d71a828f81875f2671f86396b997e5ed693', 'SALTSCORE_ROOT'),
            @('cmeta', 'v0.1.003', 'CMeta.Native.0.1.3.nupkg', 'da102797fb4183351af54b450f89055d35d9a25c3631c8111a33105c2e74e2fd', 'CMETA_ROOT')
          )
          foreach ($package in $sdkPackages) {
            $archive = Join-Path $env:RUNNER_TEMP $package[2]
            & $curl --fail --location --silent --show-error --retry 3 `
              "https://github.com/qigao/$($package[0])/releases/download/$($package[1])/$($package[2])" --output $archive
            if ($LASTEXITCODE -ne 0) { throw "SDK download failed: $($package[2])" }
            if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $package[3]) { throw 'SDK SHA256 mismatch' }
            $destination = Join-Path $env:RUNNER_TEMP $package[0]
            python -m zipfile -e $archive $destination
            if ($LASTEXITCODE -ne 0) { throw 'SDK extraction failed' }
            $prefix = (Join-Path $destination 'sdk/${{ matrix.rid }}') -replace '\\', '/'
            "$($package[4])=$prefix" >> $env:GITHUB_ENV
          }
          $platform, $digest, $extension = if ($IsWindows) {
            'windows-x86_64', '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84', 'zip'
          } elseif ($IsMacOS) {
            'darwin', 'cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc', 'tar.gz'
          } else {
            'linux-x86_64-glibc', 'b1f7fbb60ee24b80a6abae09ec4fcc6554fbf98c933c9bd25a3f53ab685fc00b', 'tar.gz'
          }
          $name = "ccache-4.14.2-$platform"
          $archive = Join-Path $env:RUNNER_TEMP "$name.$extension"
          & $curl --fail --location --silent --show-error --retry 3 `
            "https://github.com/ccache/ccache/releases/download/v4.14.2/$name.$extension" --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'ccache download failed' }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $digest) { throw 'ccache SHA256 mismatch' }
          if ($IsWindows) {
            python -m zipfile -e $archive $env:RUNNER_TEMP
          } else {
            tar -xf $archive -C $env:RUNNER_TEMP
          }
          if ($LASTEXITCODE -ne 0) { throw 'ccache extraction failed' }
          (Join-Path $env:RUNNER_TEMP $name) >> $env:GITHUB_PATH
      # Test-only tool qualification from cache PR #282; production pins stay released.
      - uses: actions/checkout@v4
        if: runner.os == 'Windows' && matrix.content == 'ON'
        with:
          repository: qigao/vcpkg-cache
          ref: b247d9c4cf738fbf5640cd4ad82832e74929e756
          path: build/windows-tool-candidate
          persist-credentials: false
      - name: Build and qualify the exact static Windows ugrep candidate
        if: runner.os == 'Windows' && matrix.content == 'ON'
        env:
          TOOL_TRIPLET: qigao-x64-windows-llvm-mingw-static
        run: python build/windows-tool-candidate/tests/search-tools/run.py
      - name: Stage the live source on the existing system-volume journal
        if: matrix.live
        id: live_source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path "$env:SystemDrive/" "fsx-ntfs-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $source | Out-Null
          git worktree add --detach $source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage owned live-test source' }
          "path=$($source -replace '\\', '/')" >> $env:GITHUB_OUTPUT
      - name: Configure source-owned tests
        working-directory: ${{ steps.live_source.outputs.path || github.workspace }}
        run: >-
          cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DFSX_BUILD_SEARCH_TOOLS=${{ matrix.search_tools }}
          -DFSX_BUILD_CONTENT_TESTS=${{ matrix.content }}
          -DFSX_CONTENT_TEST_UGREP=${{ github.workspace }}/${{ matrix.ugrep }}
          -DFSX_CONTENT_TEST_BFS=${{ github.workspace }}/build/${{ matrix.preset }}/vcpkg_installed/${{ matrix.triplet }}/tools/bfs/bfs
      - name: Build
        working-directory: ${{ steps.live_source.outputs.path || github.workspace }}
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Run formal CTest suite
        if: ${{ !matrix.live }}
        working-directory: ${{ github.workspace }}
        run: ctest --preset ${{ matrix.preset }}
      - name: Run real NTFS acceptance and same-build comparisons
        if: matrix.live
        working-directory: ${{ steps.live_source.outputs.path }}
        shell: pwsh
        env:
          FSX_NTFS_TEST_RAW_MFT: '1'
          FSX_NTFS_TEST_PROFILE: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --preset windows-native-regression
          if ($LASTEXITCODE -ne 0) { throw 'Release regression tests failed' }
          $regression = "build/${{ matrix.preset }}/tests/reports/regression"
          New-Item -ItemType Directory -Force -Path $regression | Out-Null
          Get-ChildItem "build/${{ matrix.preset }}/tests/ntfs-replay-*.csv" | Move-Item -Destination $regression
          $replay = Join-Path (Get-Location) "build/${{ matrix.preset }}/tests/reports/replay"
          New-Item -ItemType Directory -Force -Path $replay | Out-Null
          $env:FSX_NTFS_BENCHMARK = '1'
          ctest --preset windows-native-regression -R '^fsx_ntfs_benchmark_test$' --verbose --output-junit "$replay/junit.xml"
          $status = $LASTEXITCODE
          Get-ChildItem "build/${{ matrix.preset }}/tests/ntfs-replay-*.csv" | Move-Item -Destination $replay
          Copy-Item "build/${{ matrix.preset }}/Testing/Temporary/LastTest.log" "$replay/LastTest.log"
          if ($status -ne 0) { throw 'Controlled NTFS replay failed' }
          $measurements = Get-ChildItem "$replay/ntfs-replay-*.csv" -Exclude '*-queries.csv'
          $queries = Get-ChildItem "$replay/ntfs-replay-*-queries.csv"
          python tools/ntfs_benchmark_report.py $measurements.FullName $queries.FullName > "$replay/summary.json"
          if ($LASTEXITCODE -ne 0) { throw 'Controlled replay analysis failed' }
          Remove-Item Env:FSX_NTFS_BENCHMARK
          $variants = @(
            @{ Name = 'serial-file'; Async = '0'; Queue = '0'; Pages = '0' },
            @{ Name = 'job-file'; Async = '1'; Queue = '0'; Pages = '0' },
            @{ Name = 'pipeline-file'; Async = '1'; Queue = '4'; Pages = '0' },
            @{ Name = 'pipeline-memory'; Async = '1'; Queue = '4'; Pages = '4096' }
          )
          foreach ($variant in $variants) {
            $env:FSX_NTFS_TEST_INDEX_ASYNC = $variant.Async
            $env:FSX_NTFS_TEST_PIPELINE_BATCHES = $variant.Queue
            $env:FSX_NTFS_TEST_WORK_MEMORY_PAGES = $variant.Pages
            $report = Join-Path (Get-Location) "build/${{ matrix.preset }}/tests/reports/$($variant.Name)"
            New-Item -ItemType Directory -Force -Path $report | Out-Null
            ctest --preset ${{ matrix.preset }} --verbose --output-junit "$report/junit.xml"
            $status = $LASTEXITCODE
            Get-ChildItem "build/${{ matrix.preset }}/tests/ntfs-live-*.csv" | Move-Item -Destination $report
            Copy-Item "build/${{ matrix.preset }}/Testing/Temporary/LastTest.log" "$report/LastTest.log"
            if ($status -ne 0) { throw "Real NTFS acceptance failed: $($variant.Name)" }
          }
      - name: Preserve real-volume measurements and test logs
        if: always() && matrix.live && steps.live_source.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-live-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ steps.live_source.outputs.path }}/build/${{ matrix.preset }}/tests/reports/**
            ${{ steps.live_source.outputs.path }}/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 30
      - name: Compiler cache statistics
        if: always() && steps.sdks.outcome == 'success'
        run: ccache --show-stats
      - name: Remove the owned live source worktree
        if: always() && matrix.live && steps.live_source.outputs.path != ''
        shell: pwsh
        env:
          FSX_LIVE_SOURCE: ${{ steps.live_source.outputs.path }}
        run: git worktree remove --force "$env:FSX_LIVE_SOURCE"

  ntfs-live:
    name: NTFS live Release
    if: contains(github.event.pull_request.labels.*.name, 'ci/ntfs-live') || inputs.ntfs_live == true
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - {runner: windows-2025, rid: windows-x64, preset: windows-native-release, triplet: qigao-x64-windows-llvm-mingw, live: true, content: 'OFF', search_tools: 'OFF', ugrep: 'build/windows-native-release/vcpkg_installed/qigao-x64-windows-llvm-mingw/tools/ugrep/ugrep.exe'}
    env: *native_environment
    steps: *native_steps
